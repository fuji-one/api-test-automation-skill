[pytest]
testpaths = testcases
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -s --alluredir=reports/allure-results
empty_parameter_set_mark = skip
markers =
    main_flow: 主流程用例
    branch_flow: 分支流程用例
    optional_async: 默认不收集的可选慢异步用例
    case_id(value): 源文档中的用例编号
    preconditions(rules): 用例执行前的前置铺数规则
    cleanup(rules): 用例执行后的数据清理规则
    db_assertions(rules): 需要数据库 fixture 查询的落库断言
